name: Bug report
description: Report a bug in sigeval
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A minimal code sample that reproduces the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output / traceback
      render: shell
    validations:
      required: false

  - type: input
    id: sigeval-version
    attributes:
      label: sigeval version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.6"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: false
